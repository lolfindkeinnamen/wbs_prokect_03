<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movie Diary</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <nav class="flex gap-6 p-4">
  <a href="index.html">Startseite</a>
  <a href="pokedex.html">Mein Pokédex</a>
</nav>
<form id="search-form" class="flex flex-wrap gap-3 p-4">
  <label for="search-input">Pokémon suchen:</label>
  <input
    id="search-input"
    name="pokemon"
    type="search"
    class="rounded border p-2"
  />
  <button type="submit" class="rounded bg-blue-700 p-2 text-white">
    Suchen
  </button>
</form>
<dialog id="search-dialog" class="m-auto rounded-lg p-6">
  <h2 class="text-xl font-bold">Suchergebnisse</h2>
  <div id="search-results"></div>

  <form method="dialog">
    <button class="mt-4 rounded border p-2">Schließen</button>
  </form>
</dialog>
<p id="load-message" role="status" class="p-4 text-red-700"></p>
    <!--
      Homepage.

      What goes here: the navbar (FR008), a search bar (FR010), a container for
      the movie cards (FR011) and a <dialog> for the search results.
    -->

    <!-- Your TMDB token, from the copy you made of config.example.js. It has to
         load before main.js. See "The setup" in README.md. -->
    <script src="config.js"></script>
    <script src="main.js"></script>
  </body>
 
</html>
